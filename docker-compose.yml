services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: ao_mapper
      POSTGRES_PASSWORD: ao_mapper
      POSTGRES_DB: ao_mapper
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ao_mapper -d ao_mapper"]
      interval: 5s
      timeout: 5s
      retries: 10

  redis:
    image: redis:7-alpine
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 10

volumes:
  postgres_data:
  redis_data:
